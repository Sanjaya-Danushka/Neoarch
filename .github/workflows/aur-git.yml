name: AUR - neoarch-git

on:
  push:
    branches: [dev]

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Generate .SRCINFO
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" archlinux:latest bash -c '
            pacman -Sy --noconfirm base-devel git
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
            mkdir -p /tmp/build
            cp /src/packaging/PKGBUILD /tmp/build/
            cp /src/packaging/neoarch-git.install /tmp/build/
            chown -R builder:builder /tmp/build
            su builder -c "cd /tmp/build && makepkg --printsrcinfo" > /src/packaging/.SRCINFO
          '

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

      - name: Push to AUR
        run: |
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o StrictHostKeyChecking=no"
          git clone ssh://aur@aur.archlinux.org/neoarch-git.git aur-repo
          cp packaging/PKGBUILD aur-repo/
          cp packaging/neoarch-git.install aur-repo/
          cp packaging/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to push"
          else
            git commit -m "Update neoarch-git from dev branch (${GITHUB_SHA::7})"
            git push origin HEAD
          fi
