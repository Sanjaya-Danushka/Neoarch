name: AUR - neoarch-git

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Generate version and .SRCINFO
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "3.1.0")
          REV=$(git rev-list --count HEAD)
          HASH=$(git rev-parse --short=7 HEAD)
          VERSION="$(echo "$TAG" | sed 's/^v//;s/-/./g').r${REV}.g${HASH}"
          echo "Version: $VERSION"

          printf 'pkgbase = neoarch-git\n' > packaging/.SRCINFO
          printf '\tpkgver = %s\n' "$VERSION" >> packaging/.SRCINFO
          printf '\tpkgrel = 1\n' >> packaging/.SRCINFO
          printf '\tpkgdesc = NeoArch Package Manager for Arch Linux (Lynx Edition — development build, use '\''neoarch'\'' for stable)\n' >> packaging/.SRCINFO
          printf '\turl = https://github.com/Sanjaya-Danushka/Neoarch\n' >> packaging/.SRCINFO
          printf '\tinstall = neoarch-git.install\n' >> packaging/.SRCINFO
          printf '\tarch = any\n' >> packaging/.SRCINFO
          printf '\tlicense = MIT\n' >> packaging/.SRCINFO
          printf '\tdepends = python-pyqt6\n' >> packaging/.SRCINFO
          printf '\tdepends = python-requests\n' >> packaging/.SRCINFO
          printf '\tdepends = python-keyring\n' >> packaging/.SRCINFO
          printf '\tdepends = qt6-svg\n' >> packaging/.SRCINFO
          printf '\tdepends = git\n' >> packaging/.SRCINFO
          printf '\tdepends = flatpak\n' >> packaging/.SRCINFO
          printf '\tdepends = nodejs\n' >> packaging/.SRCINFO
          printf '\tdepends = npm\n' >> packaging/.SRCINFO
          printf '\tmakedepends = git\n' >> packaging/.SRCINFO
          printf '\tprovides = neoarch\n' >> packaging/.SRCINFO
          printf '\tconflicts = neoarch\n' >> packaging/.SRCINFO
          printf '\tsource = git+https://github.com/Sanjaya-Danushka/Neoarch.git#branch=dev\n' >> packaging/.SRCINFO
          printf '\tsha256sums = SKIP\n' >> packaging/.SRCINFO
          printf '\tpkgname = neoarch-git\n' >> packaging/.SRCINFO

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

      - name: Push to AUR
        run: |
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o StrictHostKeyChecking=no"
          git clone ssh://aur@aur.archlinux.org/neoarch-git.git aur-repo
          cp packaging/PKGBUILD aur-repo/
          cp packaging/neoarch-git.install aur-repo/
          cp packaging/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to push"
          else
            git commit -m "Update neoarch-git from dev branch (${GITHUB_SHA::7})"
            git push origin HEAD
          fi
